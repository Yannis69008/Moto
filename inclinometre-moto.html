<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Angle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Angle moto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10123a;--fg:#f5f3ff;--mut:#a9a4cf;--l:#5ec8ff;--r:#ff8a4c;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:radial-gradient(90% 55% at 50% 108%,#a3246f 0%,rgba(163,36,111,0) 70%),linear-gradient(180deg,#090b2b 0%,#17124a 50%,#2c1457 100%);background-attachment:fixed;background-color:#10123a}
body{margin:0;height:100%;background:transparent;color:var(--fg);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;display:flex;flex-direction:column;gap:10px;padding:12px 14px;box-sizing:border-box;max-width:460px;margin:0 auto;-webkit-user-select:none;user-select:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#dbg{margin:0;text-align:center;font-size:13px;color:var(--mut);letter-spacing:.02em}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:radial-gradient(70% 62% at 50% 62%,rgba(170,185,255,.55),rgba(120,130,230,.16) 60%,transparent 80%),var(--card)}
#bikewrap{height:min(100%,300px);display:flex;justify-content:center;align-items:flex-end;border-bottom:2px solid rgba(255,255,255,.4);width:100%}
#bikeimg{height:100%;width:auto;transform-origin:49.8% 100%;will-change:transform}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dash .card{padding:8px 14px 10px;text-align:center}
.big{font-size:68px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sub{font-size:15px;color:var(--mut);height:18px;margin-top:2px}
#spd small{font-size:16px;color:var(--mut);font-weight:500}
.maxes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.maxes .card{display:flex;align-items:baseline;justify-content:space-between;padding:8px 14px}
.maxes span{font-size:15px;color:var(--mut)}
.maxes b{font-size:30px;font-variant-numeric:tabular-nums}
#bl b{color:var(--l)}#br b{color:var(--r)}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:18px;font-weight:600;border:0;border-radius:999px;padding:11px 8px;background:var(--card);color:var(--fg);border:1px solid var(--line);flex:1}
button#start{flex:1.6;background:linear-gradient(135deg,#ff8a4c,#ff4f8b);color:#fff;border-color:transparent}
#msg{margin:0;font-size:13px;color:var(--mut);text-align:center}

.top{display:flex;align-items:center;gap:8px}
.top #dbg{flex:1}
.pill{flex:none!important;font-size:15px;padding:5px 12px;border-radius:999px}
.big{font-size:calc(68px*var(--k,1))}
html[data-theme="night"]{background:#000;background-image:none}
:root[data-theme="night"]{--fg:#e6e7ea;--mut:#868b94;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--l:#4aa8d8;--r:#e0763a}
html[data-theme="night"] .stage{background:radial-gradient(70% 62% at 50% 62%,rgba(150,160,190,.38),transparent 75%),var(--card)}
html[data-theme="night"] button#start{background:linear-gradient(135deg,#c9692f,#b23a62)}
#hist{display:none;position:fixed;inset:0;z-index:10;overflow:auto;background:#0d0f2e;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
html[data-theme="night"] #hist{background:#000}
#hist.open{display:block}
#hbody{max-width:520px;margin:0 auto}
.hh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hh h2{margin:0;font-size:24px;font-weight:600;flex:1;text-align:center}
.empty{color:var(--mut);text-align:center;margin:40px 10px;font-size:18px}
.ride{padding:10px 14px;margin-bottom:10px}
.rt{display:flex;justify-content:space-between;align-items:baseline;font-size:20px}
.rt span,.rs{color:var(--mut);font-size:16px}
.rs{display:flex;gap:14px;margin-top:4px}
.cl{color:var(--l)}.cr{color:var(--r)}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.st{padding:8px 6px;text-align:center}
.st b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--mut)}
.trailc{width:100%;height:min(80vw,380px);display:block;background:rgba(0,0,0,.28)}
.legend{font-size:13px;color:var(--mut);margin:8px 2px}
@media (orientation:landscape) and (max-height:520px){
  body{max-width:none;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto auto auto 1fr;column-gap:12px;row-gap:8px;padding:8px 16px}
  .top{grid-column:2;grid-row:1}.stage{grid-column:1;grid-row:1/-1;padding:10px}
  .dash{grid-column:2;grid-row:2}.maxes{grid-column:2;grid-row:3}.btns{grid-column:2;grid-row:4}#msg{grid-column:2;grid-row:5;align-self:start}
  .big{font-size:calc(52px*var(--k,1))}
  #bikewrap{height:100%}
}
</style>
</head>

<section class="dash">
  <div class="card"><div class="big" id="val">--&deg;</div><div class="sub" id="side"></div></div>
  <div class="card"><div class="big" id="spd">-- <small>km/h</small></div><div class="sub">vitesse</div></div>
</section>
<section class="maxes">
  <div class="card" id="bl"><span>Max gauche</span><b id="ml">0&deg;</b></div>
  <div class="card" id="br"><span>Max droite</span><b id="mr">0&deg;</b></div>
</section>
<div class="btns">
  <button id="start">D&eacute;marrer</button>
  <button id="hbtn">Sorties</button>
  <button id="rst">Reset max</button>
</div>
<p id="msg">Fixe l&rsquo;iPhone dans n&rsquo;importe quel sens, puis touche D&eacute;marrer.</p>
<div id="hist"><div id="hbody"></div></div>
<script>
(function(){
  var MIN=15,KEY="rides",ux=0,uy=1,uz=0,haveUp=false,v=0,f=0,maxL=0,maxR=0,on=false,ready=false,frozen=true,gid=null,wl=null,ride=null,lastLat=null,lastLon=null,lastStore=0,cs={on:false};
  var $=function(i){return document.getElementById(i)};
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function save(l){try{localStorage.setItem(KEY,JSON.stringify(l));return true}catch(e){return false}}
  function persist(){
    if(!ride)return; var l=load(),i=l.findIndex(function(r){return r.id===ride.id});
    if(i<0)l.unshift(ride); else l[i]=ride;
    while(!save(l)&&l.length>1)l.pop();
  }
  function ori(e){
    if(e.beta==null||e.gamma==null)return;
    var b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
    ux=-Math.cos(b)*Math.sin(g);uy=Math.sin(b);uz=Math.cos(b)*Math.cos(g);haveUp=true;
  }
  function endCorner(){
    if(ride&&cs.peak>=20&&cs.lat!=null)ride.c.push([+cs.lat.toFixed(5),+cs.lon.toFixed(5),Math.round(cs.peak),cs.side]);
    cs={on:false};
  }
  function track(){
    var a=Math.abs(f),side=f>0?"R":"L";
    if(cs.on&&(a<8||(side!==cs.side&&a>15)))endCorner();
    if(!cs.on){if(a>15)cs={on:true,peak:a,side:side,lat:lastLat,lon:lastLon}}
    else if(a>cs.peak){cs.peak=a;cs.lat=lastLat;cs.lon=lastLon}
  }
  function mot(e){
    var r=e.rotationRate;if(!r||r.alpha==null||!haveUp)return;
    var w=(r.beta*ux+r.gamma*uy+r.alpha*uz)*Math.PI/180;
    frozen=v*3.6<MIN;
    if(!frozen){
      var phi=Math.atan(-v*w/9.81)*180/Math.PI;
      if(phi>70)phi=70;if(phi<-70)phi=-70;
      f+=(phi-f)*0.15;
      if(f>maxR)maxR=f;if(-f>maxL)maxL=-f;
      if(ride){if(f>ride.mR)ride.mR=f;if(-f>ride.mL)ride.mL=-f;track()}
    }
    draw();
  }
  function draw(){
    var m=Math.abs(f);
    $("val").textContent=Math.round(m)+"\u00B0";
    $("side").textContent=frozen?"figé":(m<1?"droit":(f>0?"droite":"gauche"));
    $("bikeimg").style.transform="rotate("+f.toFixed(1)+"deg)";
    $("mr").textContent=Math.round(maxR)+"\u00B0";$("ml").textContent=Math.round(maxL)+"\u00B0";
    $("dbg").textContent=ride?"\u25CF enregistrement en cours":"angle calculé avec GPS + gyroscope";
  }
  function gps(){
    if(!navigator.geolocation){$("spd").innerHTML="GPS indisponible";return}
    gid=navigator.geolocation.watchPosition(function(p){
      var s=p.coords.speed;v=(s==null||s<0)?0:s;var k=Math.round(v*3.6);
      $("spd").innerHTML=(s==null||s<0?"--":k)+' <small>km/h</small>';
      lastLat=p.coords.latitude;lastLon=p.coords.longitude;
      if(ride){
        if(v*3.6>ride.mV)ride.mV=v*3.6;
        var n=Date.now();
        if(n-lastStore>=2000){lastStore=n;ride.p.push([+lastLat.toFixed(5),+lastLon.toFixed(5),Math.round(f),k]);ride.t1=n;if(ride.p.length%10===0)persist()}
      }
    },function(){$("spd").innerHTML='GPS refusé <small>Réglages > Confidentialité > Localisation</small>'},{enableHighAccuracy:true,maximumAge:0});
  }
  async function start(){
    try{
      if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){
        var r=await DeviceOrientationEvent.requestPermission();
        if(r!=="granted"){$("msg").textContent="Capteurs refusés.";return}
      }
      if(typeof DeviceMotionEvent!=="undefined"&&DeviceMotionEvent.requestPermission){try{await DeviceMotionEvent.requestPermission()}catch(e){}}
      if(!ready){window.addEventListener("deviceorientation",ori);window.addEventListener("devicemotion",mot);ready=true}
      gps();
      ride={id:Date.now(),t0:Date.now(),t1:Date.now(),mL:0,mR:0,mV:0,p:[],c:[]};cs={on:false};lastStore=0;
      on=true;$("start").textContent="Terminer";
      $("msg").textContent="Sortie en cours. L'angle apparaît au-dessus de "+MIN+" km/h.";
      try{wl=await navigator.wakeLock.request("screen")}catch(e){}
    }catch(e){$("msg").textContent="Capteurs indisponibles sur cette page."}
  }
  function stop(){
    if(gid!=null){navigator.geolocation.clearWatch(gid);gid=null}
    if(ride){
      if(cs.on)endCorner();
      ride.t1=Date.now();
      if(ride.p.length>=2){persist();$("msg").textContent="Sortie enregistrée. Retrouve-la dans Sorties."}
      else{save(load().filter(function(x){return x.id!==ride.id}));$("msg").textContent="Sortie trop courte, non enregistrée."}
      ride=null;
    }
    try{wl&&wl.release&&wl.release()}catch(e){}
    on=false;frozen=true;$("start").textContent="Démarrer";draw();
  }
  $("start").onclick=function(){on?stop():start()};
  $("rst").onclick=function(){maxL=maxR=0;draw()};
  document.addEventListener("visibilitychange",async function(){
    if(document.visibilityState==="hidden")persist();
    else if(on){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
  });
  window.addEventListener("pagehide",persist);

  /* ---------- historique ---------- */
  function pad(n){return(n<10?"0":"")+n}
  function dur(ms){var m=Math.max(1,Math.round(ms/60000)),h=Math.floor(m/60);return h?h+" h "+pad(m%60):m+" min"}
  function when(t){return new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
  function km(r){var d=0,p=r.p;for(var i=1;i<p.length;i++){var a=p[i-1],b=p[i],x=(b[1]-a[1])*Math.cos(a[0]*Math.PI/180),y=b[0]-a[0];d+=Math.sqrt(x*x+y*y)*111.2}return d}
  function stat(a,b){return '<div class="card st"><b>'+a+'</b><span>'+b+'</span></div>'}
  function list(){
    var l=load(),h='<div class="hh"><h2>Sorties</h2><button class="pill" id="hx">Fermer</button></div>';
    if(!l.length)h+='<p class="empty">Aucune sortie pour l\u2019instant. Touche Démarrer pour en enregistrer une.</p>';
    l.forEach(function(r){h+='<div class="card ride" data-id="'+r.id+'"><div class="rt"><b>'+when(r.t0)+'</b><span>'+dur(r.t1-r.t0)+' \u00B7 '+km(r).toFixed(1)+' km</span></div><div class="rs"><span>'+Math.round(r.mV)+' km/h max</span><span class="cl">G '+Math.round(r.mL)+'\u00B0</span><span class="cr">D '+Math.round(r.mR)+'\u00B0</span></div></div>'});
    $("hbody").innerHTML=h;
  }
  function col(a){return a<15?"#8da2d6":a<30?"#5ec8ff":a<45?"#ff8a4c":"#ff3d5a"}
  function trail(r){
    var cv=$("trail"),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;var g=cv.getContext("2d");g.scale(dpr,dpr);
    var p=r.p;
    if(p.length<2){g.fillStyle="#a9a4cf";g.font="16px sans-serif";g.fillText("Pas assez de points GPS",16,30);return}
    var la=0;p.forEach(function(q){la+=q[0]});la/=p.length;var kx=Math.cos(la*Math.PI/180);
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    p.forEach(function(q){var x=q[1]*kx,y=-q[0];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y});
    var pad=28,sw=Math.max(x1-x0,1e-6),sh=Math.max(y1-y0,1e-6),sc=Math.min((W-2*pad)/sw,(H-2*pad)/sh),ox=(W-sw*sc)/2,oy=(H-sh*sc)/2;
    var X=function(lon){return ox+(lon*kx-x0)*sc},Y=function(lat){return oy+(-lat-y0)*sc};
    g.lineWidth=4;g.lineCap="round";g.lineJoin="round";
    for(var i=1;i<p.length;i++){g.strokeStyle=col(Math.abs(p[i][2]));g.beginPath();g.moveTo(X(p[i-1][1]),Y(p[i-1][0]));g.lineTo(X(p[i][1]),Y(p[i][0]));g.stroke()}
    var placed=[];
    r.c.slice().sort(function(a,b){return b[2]-a[2]}).forEach(function(c){
      if(c[2]<25)return;var x=X(c[1]),y=Y(c[0]);
      if(placed.some(function(o){return Math.hypot(o[0]-x,o[1]-y)<28}))return;placed.push([x,y]);
      g.fillStyle=c[3]==="L"?"#5ec8ff":"#ff8a4c";g.beginPath();g.arc(x,y,13,0,7);g.fill();
      g.fillStyle="#0b0c1e";g.font="bold 11px sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(c[2]+"\u00B0",x,y+.5);
    });
    var a=p[0],b=p[p.length-1];
    g.fillStyle="#4ade80";g.beginPath();g.arc(X(a[1]),Y(a[0]),6,0,7);g.fill();
    g.fillStyle="#fff";g.beginPath();g.arc(X(b[1]),Y(b[0]),6,0,7);g.fill();
  }
  function detail(id){
    var r=load().filter(function(x){return String(x.id)===String(id)})[0];if(!r){list();return}
    $("hbody").innerHTML='<div class="hh"><button class="pill" id="hb">\u2039 Retour</button><h2>'+when(r.t0)+'</h2><button class="pill" id="hd" data-id="'+r.id+'">Supprimer</button></div>'+
      '<div class="grid4">'+stat(dur(r.t1-r.t0),"durée")+stat(km(r).toFixed(1)+" km","distance")+stat(Math.round(r.mV)+" km/h","vitesse max")+stat('<span class="cl" style="font-size:24px;color:var(--l)">'+Math.round(r.mL)+'\u00B0</span>',"max gauche")+stat('<span style="font-size:24px;color:var(--r)">'+Math.round(r.mR)+'\u00B0</span>',"max droite")+stat(r.c.length,"virages")+'</div>'+
      '<canvas id="trail" class="card trailc"></canvas>'+
      '<p class="legend">Couleur du trajet : inclinaison (gris &lt; 15\u00B0, bleu &lt; 30\u00B0, orange &lt; 45\u00B0, rouge au-delà). Pastilles : angle max de chaque virage (bleu gauche, orange droite). Point vert : départ, blanc : arrivée.</p>';
    trail(r);
  }
  $("hbtn").onclick=function(){$("hist").classList.add("open");list()};
  $("hbody").onclick=function(e){
    var t=e.target;
    if(t.id==="hx")$("hist").classList.remove("open");
    else if(t.id==="hb")list();
    else if(t.id==="hd"){if(confirm("Supprimer cette sortie ?")){var id=t.getAttribute("data-id");save(load().filter(function(x){return String(x.id)!==id}));list()}}
    else{var c=t.closest&&t.closest(".ride");if(c)detail(c.getAttribute("data-id"))}
  };

  /* ---------- confort : thème et taille ---------- */
  var KS=[1,1.15,1.3],kk=0;
  function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("tbtn").textContent=t==="night"?"Violet":"Nuit";try{localStorage.setItem("theme",t)}catch(e){}}
  function setK(i){kk=i%3;document.documentElement.style.setProperty("--k",KS[kk]);$("kbtn").textContent=["A","A+","A++"][kk];try{localStorage.setItem("k",kk)}catch(e){}}
  var th="violet";try{th=localStorage.getItem("theme")||"violet";kk=+localStorage.getItem("k")||0}catch(e){}
  applyTheme(th);setK(kk);
  $("tbtn").onclick=function(){applyTheme(document.documentElement.getAttribute("data-theme")==="night"?"violet":"night")};
  $("kbtn").onclick=function(){setK(kk+1)};
})();
</script>
</body>
</html>
