<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Angle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Angle moto</title>
<style>
:root{--bg:#f2f0eb;--fg:#15171a;--mut:#6b6f76;--l:#1f6feb;--r:#e5484d;--card:#e6e3dc;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--fg:#f1f2f4;--mut:#8b9098;--l:#4c9aff;--r:#ff6b6f;--card:#1a1d22}}
:root[data-theme="dark"]{--bg:#0e1013;--fg:#f1f2f4;--mut:#8b9098;--l:#4c9aff;--r:#ff6b6f;--card:#1a1d22}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
#bikewrap{height:min(38vh,320px);display:flex;justify-content:center;align-items:flex-end;border-bottom:2px solid var(--mut);width:min(92vw,380px)}
#bikeimg{height:100%;width:auto;transform-origin:51.5% 100%;will-change:transform}
#val{font-size:min(30vw,150px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#side{font-size:28px;color:var(--mut);height:32px}
.row{display:flex;gap:12px;width:100%;max-width:420px}
.box{flex:1;background:var(--card);border-radius:14px;padding:10px 14px;text-align:center}
.box b{display:block;font-size:44px;font-variant-numeric:tabular-nums}
#spd{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}#spd small{font-size:24px;color:var(--mut);font-weight:400}
.box span{font-size:18px;color:var(--mut)}
#bl b{color:var(--l)}#br b{color:var(--r)}
button{font:inherit;font-size:22px;font-weight:600;border:0;border-radius:14px;padding:14px;background:var(--fg);color:var(--bg);flex:1}
button.alt{background:var(--card);color:var(--fg)}
#msg{font-size:18px;color:var(--mut);text-align:center;max-width:380px}
</style>
</head>

    if(e.beta==null||e.gamma==null) return;
    var b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
    ux=-Math.cos(b)*Math.sin(g); uy=Math.sin(b); uz=Math.cos(b)*Math.cos(g); haveUp=true;
  }
  function mot(e){
    var r=e.rotationRate; if(!r||r.alpha==null||!haveUp) return;
    // rotation autour de la verticale (rad/s) : + = virage à gauche
    var w=(r.beta*ux+r.gamma*uy+r.alpha*uz)*Math.PI/180;
    frozen=v*3.6<MIN;
    if(!frozen){
      var phi=Math.atan(-v*w/9.81)*180/Math.PI; // + = droite
      if(phi>70)phi=70; if(phi<-70)phi=-70;
      f+=(phi-f)*0.15;
      if(f>maxR)maxR=f; if(-f>maxL)maxL=-f;
    }
    draw();
  }
  function draw(){
    var m=Math.abs(f);
    $("val").textContent=Math.round(m)+"\u00B0";
    $("side").textContent=frozen?"figé (< "+MIN+" km/h)":(m<1?"droit":(f>0?"droite":"gauche"));
    $("bikeimg").style.transform="rotate("+f.toFixed(1)+"deg)";
    $("mr").textContent=Math.round(maxR)+"\u00B0"; $("ml").textContent=Math.round(maxL)+"\u00B0";
    $("dbg").textContent="angle calculé avec GPS + gyroscope";
  }
  function gps(){
    if(!navigator.geolocation){ $("spd").innerHTML='GPS indisponible'; return }
    navigator.geolocation.watchPosition(function(p){
      var s=p.coords.speed; v=(s==null||s<0)?0:s;
      $("spd").innerHTML=(s==null||s<0?'--':Math.round(s*3.6))+' <small>km/h</small>';
    },function(){ $("spd").innerHTML='GPS refusé <small>Réglages > Confidentialité > Localisation</small>' },{enableHighAccuracy:true,maximumAge:0});
  }
  async function start(){
    try{
      if(typeof DeviceOrientationEvent!=="undefined" && DeviceOrientationEvent.requestPermission){
        var r=await DeviceOrientationEvent.requestPermission();
        if(r!=="granted"){ $("msg").textContent="Capteurs refusés."; return }
      }
      if(typeof DeviceMotionEvent!=="undefined" && DeviceMotionEvent.requestPermission){
        try{ await DeviceMotionEvent.requestPermission() }catch(e){}
      }
      window.addEventListener("deviceorientation",ori);
      window.addEventListener("devicemotion",mot);
      gps(); on=true; $("start").textContent="En marche";
      $("msg").textContent="L'angle apparaît au-dessus de "+MIN+" km/h.";
      try{ wl=await navigator.wakeLock.request("screen") }catch(e){}
    }catch(e){ $("msg").textContent="Capteurs indisponibles sur cette page." }
  }
  $("start").onclick=start;
  $("zero").onclick=function(){ f=0; maxL=maxR=0; draw() };
  $("rst").onclick=function(){ maxL=maxR=0; draw() };
  document.addEventListener("visibilitychange",async function(){
    if(on&&document.visibilityState==="visible"){ try{ wl=await navigator.wakeLock.request("screen") }catch(e){} }
  });
})();
</script>
</body>
